[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symmelie"
version = "0.1.0"
description = "Generator-based equivariant PyTorch layers and hyperbolic geometry"
requires-python = ">=3.9"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["symmelie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
